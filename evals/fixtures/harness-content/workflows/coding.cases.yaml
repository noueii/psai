- name: small task skips the plan
  path: [clarify, implement, verify_prep, verify, ai_review, human_review, sanitize, handover, ready]

- name: big task iterates the plan with the human
  take: { clarify: [big], plan_review: [changes requested, changes requested, changes requested, accepted] }
  path: [clarify, plan, plan_review, plan, plan_review, plan, plan_review, plan, plan_review,
         implement, verify_prep, verify, ai_review, human_review, sanitize, handover, ready]

- name: verify fails 3x escalates
  take:
    verify: [fail, fail, fail]
    implement: [no checks yet or the spec changed, checks exist and the spec is unchanged, checks exist and the spec is unchanged]
  path: [clarify, implement, verify_prep, verify, implement, verify, implement, verify, escalate]
  asker: verify

- name: review rework goes back to implement then verify, without QA
  take:
    ai_review: [rework, clean]
    implement: [no checks yet or the spec changed, checks exist and the spec is unchanged]
  path: [clarify, implement, verify_prep, verify, ai_review, implement, verify, ai_review, human_review, sanitize, handover, ready]

- name: rework that changes the spec re-runs QA
  take:
    ai_review: [rework, clean]
  path: [clarify, implement, verify_prep, verify, ai_review, implement, verify_prep, verify, ai_review, human_review, sanitize, handover, ready]

- name: small review fix goes back to verify
  take: { ai_review: [small fix, clean] }
  path: [clarify, implement, verify_prep, verify, ai_review, verify, ai_review, human_review, sanitize, handover, ready]

- name: spec gap escalates
  take: { ai_review: [spec gap] }
  ends: escalate
  asker: ai_review

- name: blocking question escalates from clarify
  take: { clarify: [blocking question] }
  path: [clarify, escalate]
  asker: clarify

- name: human review loops have no limit
  take: { human_review: [small fix, small fix, small fix, approved] }
  ends: ready

- name: sanitize that breaks a check re-verifies
  take: { sanitize: [a check broke, clean] }
  path: [clarify, implement, verify_prep, verify, ai_review, human_review, sanitize, verify, ai_review, human_review, sanitize, handover, ready]
