name: happy-path
level: L3
about: A small, clear task runs the whole coding loop without escalating.
content: harness-content
fixture: textkit
task: >-
  Add `truncate(text, n)` to textkit/text.py and export it from textkit: return `text` unchanged when it has at most
  n characters, otherwise the first n-1 characters followed by "…" (so the result has length n). n < 1 raises
  ValueError. Mention it in README.md.
owner:
  review: Approved.
  max_turns: 6
expect:
  path_includes: [clarify, implement, verify_prep, verify, ai_review, human_review, sanitize, handover, ready]
  path_excludes: [plan]
  escalations: { max: 0 }
  roles_checked: [engineer, qa, reviewer]
  checks: python3 -m unittest -q
  handover: [What changed, How it was verified, Decisions made without you, "Open, needs you"]
  no_push: true
