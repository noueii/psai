name: ambiguous
level: L3
about: A vague task whose answer changes the result. Escalating from `do` is EXPECTED; the run then finishes.
content: harness-content
fixture: textkit
task: Make slugify handle separators better.
owner:
  escalations:
    - match: "separat|underscore|dash|hyphen|slug|which|what|mean|better"
      answer: >-
        Treat spaces, underscores and runs of "-" as one "-" separator, and strip leading and trailing "-".
        Leave other characters as they are.
  review: Approved.
  max_turns: 8
expect:
  escalations: { min: 1, max: 2 }
  escalation_nodes: [do, route]
  path_includes: [do, check, approve, report, ready]
  checks: python3 -m unittest -q
  final_sections: [Summary, Evidence, Open questions]
  no_push: true
