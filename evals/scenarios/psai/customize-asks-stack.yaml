name: customize-asks-stack
level: L3
about: >-
  With a pinned stack installed, changing one of its rules goes through customize-harness, which first asks which
  stack the change goes to; the owner picks their overlay, so the change is staged as an override there.
stacks: { example: harness-content }
fixture: textkit
phases:
  - name: change-a-rule
    cwd: harness
    task: >-
      Use customize-harness to change the example stack's rules guide: notes must stay under 80 characters.
    owner:
      max_turns: 8
      answers:
        - match: "which stack|stack does this|overlay|nostack|new stack|author"
          answer: My overlay (nostack). Override the example stack's guide there; don't touch the stack itself.
        - match: "scope|everywhere|this workflow"
          answer: Everywhere.
      default: Do what you recommend, and stage it.
    expect:
      first_question: "stack|overlay"
      files: [overrides/example/guides/example-rules.md]
      staged: true
      escalations: { max: 0 }
      no_push: true
