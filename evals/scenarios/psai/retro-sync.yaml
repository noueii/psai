name: retro-sync
level: L3
about: >-
  The example workflow ends report -> retro -> sync -> ready (variants/sync-tail). The retro stages and leaves the
  PR to sync, which finishes the stage as ONE local psai/ branch in the owner's stack (no remote). Nothing pushed.
stacks: { example: [stacks/example, variants/sync-tail] }
fixture: textkit
task: Add `reverse(text)` to textkit/text.py, returning the text reversed, and export it from textkit.
owner:
  review: >-
    Approved. One thing for the future: every new public function I get must have a doctest example in its
    docstring. Please remember that.
  max_turns: 6
expect:
  path_includes: [do, check, approve, report, retro, sync, ready]
  escalations: { max: 0 }
  checks: python3 -m unittest -q
  retro_findings: true
  branches: { "psai/": 1 }
  no_push: true
