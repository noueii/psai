name: retro
level: L3
about: >-
  The example workflow has no retro or sync node. work runs the retro after ready anyway: the final message ranks its
  findings, and the owner's stated preference (captured to an inbox in the owner's stack) goes into ONE local psai/
  branch there (the stack has no remote). With no sync node, sync never runs.
stacks: { example: stacks/example }
fixture: textkit
task: Add `reverse(text)` to textkit/text.py, returning the text reversed, and export it from textkit.
owner:
  review: >-
    Approved. One thing for the future: every new public function I get must have a doctest example in its
    docstring. Please remember that.
  max_turns: 6
expect:
  path_includes: [do, check, approve, report, ready]
  escalations: { max: 0 }
  checks: python3 -m unittest -q
  retro_findings: true
  branches: { "psai/": 1 }
  no_sync: true
  no_push: true
