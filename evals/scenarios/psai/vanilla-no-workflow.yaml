name: vanilla-no-workflow
level: L3
about: >-
  A repeatable task arrives with psai alone (no stack installed, no stack of the owner's). With no workflows, it must escalate and offer customize-harness,
  and change nothing.

own: none
fixture: textkit
task: Add a `reverse(text)` helper to textkit.
owner:
  escalations:
    - match: "."
      answer: Not now, thanks. Stop here.
  max_turns: 3
expect:
  router_invoked: true
  escalations: { min: 1, max: 1 }
  escalation_nodes: [route]
  mentions: [customize-harness]
  unchanged: true
  no_push: true
