# Checks this stack with the lowest psai version its stack.yaml supports: content, refs, routing, simulation.
name: psai
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psai (the lowest version this stack supports)
        run: |
          pip install pyyaml
          v="$(python3 -c "import re,yaml; print(re.search(r'>=\s*v?([0-9.]+)', yaml.safe_load(open('stack.yaml'))['psai']).group(1))")"
          git clone -q --depth 1 --branch "v$v" https://github.com/noueii/psai "$RUNNER_TEMP/psai" \
            || git clone -q --depth 1 https://github.com/noueii/psai "$RUNNER_TEMP/psai"
          mkdir -p "$RUNNER_TEMP/home/stacks" && ln -s "$RUNNER_TEMP/psai" "$RUNNER_TEMP/home/framework"
          python3 "$RUNNER_TEMP/psai/scripts/stacks.py" overlay --home "$RUNNER_TEMP/home"
      - name: psai check .
        run: PSAI_HOME="$RUNNER_TEMP/home" python3 "$RUNNER_TEMP/psai/scripts/psai.py" check .
      - name: Standalone packages are fresh (only with build.commit_dist in stack.yaml)
        run: |
          if python3 -c "import sys,yaml; sys.exit(0 if (yaml.safe_load(open('stack.yaml')).get('build') or {}).get('commit_dist') else 1)"; then
            PSAI_HOME="$RUNNER_TEMP/home" python3 "$RUNNER_TEMP/psai/scripts/psai.py" build --standalone . --check
          fi
